name: Circuits & Systems Classroom

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/configure-pages-domain.py"
      - ".github/doc-postprocess.py"
      - ".github/toolbox-drift.py"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
      - ".github/configure-pages-domain.py"
      - ".github/doc-postprocess.py"
      - ".github/toolbox-drift.py"
  # Resolve upstream main once per run. Verify it and publish the manual from that exact revision.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    needs: toolbox-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: pnpm check

      - run: pnpm build

      - name: Install Chromium for production browser regressions
        run: pnpm exec playwright install --with-deps chromium

      - name: Test the production build in Chromium
        run: pnpm test:browser

      - name: Upload browser reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # The drift job resolves upstream main and verifies this SHA before the site job starts.
      - name: Check out ADCToolbox for the reference manual
        uses: actions/checkout@v7
        with:
          repository: Arcadia-1/ADCToolbox
          ref: ${{ needs.toolbox-drift.outputs.toolbox-sha }}
          path: toolbox

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolbox/python/pyproject.toml

      - name: Install reference manual tooling
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './toolbox/python[docs]'

      # Resolve packages before the cache lookup: upstream version ranges can select newer tooling without a source edit.
      - name: Fingerprint the reference build environment
        id: reference-environment
        working-directory: .
        run: |
          python - <<'PY'
          import hashlib
          import importlib.metadata
          import os
          import platform

          packages = sorted(f"{dist.metadata['Name'].lower()}=={dist.version}" for dist in importlib.metadata.distributions())
          digest = hashlib.sha256("\n".join(packages).encode()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"identity=py{platform.python_version()}-{digest}", file=output)
          PY

      # Cache only raw Sphinx output. Exact keys prevent stale-source or cross-toolchain fallback restores.
      - name: Restore the raw English and Chinese manual
        id: reference-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/reference-manual
          key: reference-manual-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.toolbox-drift.outputs.toolbox-sha }}-${{ steps.reference-environment.outputs.identity }}-${{ hashFiles('.github/workflows/deploy-web.yml', '.github/doc-postprocess.py') }}

      - name: Build the raw English and Chinese manual
        if: steps.reference-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          python -m sphinx -b html toolbox/python/docs/source .cache/reference-manual
          python -m sphinx -b html -D language=zh_CN toolbox/python/docs/source .cache/reference-manual/zh_CN
          touch .cache/reference-manual/.nojekyll

      - name: Validate the raw manual tree
        working-directory: .
        run: |
          test -f .cache/reference-manual/index.html
          test -f .cache/reference-manual/zh_CN/index.html

      - name: Cache the raw manual before site postprocessing
        if: steps.reference-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/reference-manual
          key: ${{ steps.reference-cache.outputs.cache-primary-key }}

      - name: Copy the raw manual into the site
        working-directory: .
        run: |
          mkdir -p web/dist/doc
          cp -a .cache/reference-manual/. web/dist/doc/

      # The manual used to be the whole of this domain, so every link into it still has to land.
      - name: Fold the manual into the site
        working-directory: .
        run: python3 .github/doc-postprocess.py web/dist

      - name: Build hostname migration middleware
        run: |
          pnpm exec wrangler pages functions build functions --outdir .wrangler/pages-functions --project-directory . --build-output-directory dist
          cp .wrangler/pages-functions/index.js dist/_worker.js

      - name: Attach the public tutorial domain
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 .github/configure-pages-domain.py

      - name: Deploy to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name ams-class --branch main --commit-message "GitHub Actions ${GITHUB_SHA}"

  # The pages' tests pin the numbers ADCToolbox printed when each page was written, so they cannot notice the library
  # changing a ported function. Rerun all references, including PLL, against its main as it is now.
  # Publishing depends on this job so a numerical mismatch cannot silently reach the tutorial site.
  toolbox-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      toolbox-sha: ${{ steps.toolbox-revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out ADCToolbox
        uses: actions/checkout@v7
        with:
          repository: Arcadia-1/ADCToolbox
          ref: main
          path: toolbox

      - name: Record the ADCToolbox revision under test
        id: toolbox-revision
        working-directory: toolbox
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toolbox/python/pyproject.toml

      - run: pip install -e ./toolbox/python

      - name: Compare the verification scripts with what they printed before
        run: python .github/toolbox-drift.py
